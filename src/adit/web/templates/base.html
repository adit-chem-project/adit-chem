<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ADIT{% endblock %}</title>
<style>
/* 透明感のある色 (2026-09-11、デスクトップ版の gui/style.py と同じ系統): 地は無色に近い淡い灰色のグラデーション、面は半透明の白 + ぼかし */
:root { --bg-top:#e9e9ec; --bg-bottom:#f5f5f7; --fg:#14161b; --muted:#4b5260; --line:rgba(0,0,0,.12); --box:rgba(255,255,255,.62); --edge:rgba(255,255,255,.9);
        --field:rgba(255,255,255,.75); --hover:rgba(255,255,255,.92); --accent:#0a7aff; --accent-top:#3a95ff; --err:#d70015; --ok:#1f7a38; --pill-bg:#e1e3e8; --pill-fg:#3b4150; --radius:12px; }
@media (prefers-color-scheme: dark) { :root { --bg-top:#1c1c1e; --bg-bottom:#2a2a2d; --fg:#f0f1f4; --muted:#b6b8c2; --line:rgba(255,255,255,.13); --box:rgba(255,255,255,.06);
        --edge:rgba(255,255,255,.15); --field:rgba(255,255,255,.09); --hover:rgba(255,255,255,.16); --accent:#3d8cff; --accent-top:#6aa8ff; --err:#ff6961; --ok:#5fd07a; --pill-bg:#4a4b52; --pill-fg:#e8e9ee; } }
* { box-sizing: border-box; }
body { margin:0; padding:0 20px 32px; min-height:100vh; background:linear-gradient(135deg, var(--bg-top), var(--bg-bottom)) fixed; color:var(--fg); font:14px/1.55 "Inter", -apple-system, "Helvetica Neue", "Noto Sans CJK JP", "Noto Sans JP", system-ui, sans-serif; }
header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:14px 0 12px; margin-bottom:16px; }
header h1 { font-size:17px; font-weight:700; margin:0 14px 0 0; letter-spacing:-.01em; }
header .muted { color:var(--muted); font-size:12px; margin-left:auto; }
.cols { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap:16px; }
.convert-cols { grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (max-width: 1100px) { .cols, .convert-cols { grid-template-columns: 1fr; } }
fieldset { border:1px solid var(--edge); border-radius:var(--radius); background:var(--box); -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
           box-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); margin:0 0 16px; padding:14px 16px 16px; }
legend { font-weight:700; font-size:15px; padding:0 6px; }
.row { display:grid; grid-template-columns: 180px minmax(0,1fr); gap:8px 12px; align-items:center; margin:8px 0; }
.row .inline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
input[type=text], input[type=number], select, textarea { width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--fg); font:inherit; }
input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
.inline > input, .inline > select { min-width:0; }
.inline > select { width:auto; flex:1 1 140px; max-width:100%; }
.inline > input[type=text] { width:auto; flex:1 1 160px; }
.inline > input.narrow { flex:0 0 110px; } .inline > input.tiny { flex:0 0 64px; }
.inline > input[type=file] { flex:1 1 200px; font-size:12px; }
.inline > textarea { flex:1 1 100%; }
textarea { font-family: ui-monospace, "SF Mono", Menlo, monospace; min-height:64px; }
input[type=text]:hover, input[type=number]:hover, select:hover, textarea:hover { background:var(--hover); }
button, .btn { padding:7px 16px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--fg); font:inherit; font-weight:500; cursor:pointer; text-decoration:none; display:inline-block;
               -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
button:hover, .btn:hover { background:var(--hover); border-color:var(--edge); }
button.primary { background:linear-gradient(180deg, var(--accent-top), var(--accent)); color:#fff; border-color:var(--accent); }
button:disabled { opacity:.45; cursor:not-allowed; }
.hint { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }  /* 長いパス (data ディレクトリなど) が欄の外へ出ないように */
.status { font-weight:600; } .status.ok { color:var(--ok); } .error { color:var(--err); white-space:pre-wrap; } .message { color:var(--ok); white-space:pre-wrap; }
pre { background:var(--field); border:1px solid var(--edge); border-radius:10px; padding:10px 12px; overflow:auto; max-height:70vh; font-size:12.5px; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; } .tabs button { padding:5px 12px; border-radius:999px; } .tabs button.active { background:var(--accent); color:#fff; border-color:transparent; }
.actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:12px 0 4px; }
img.fig { max-width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; }
label.required { color:var(--accent); font-weight:600; }
/* The word next to a required label (same as the desktop version); links are underlined so the colour alone does not mean "required" */
.pill { display:inline-block; margin-left:6px; padding:0 7px; border-radius:9px; background:var(--pill-bg); color:var(--pill-fg);
        font-size:11px; font-weight:600; line-height:18px; vertical-align:1px; white-space:nowrap; }
a:not(.btn) { color:var(--accent); text-decoration:underline; }
.row > label[title] { cursor:help; }
.error-banner { border:1px solid var(--err); background:color-mix(in srgb, var(--err) 8%, transparent); color:var(--err); font-weight:600; border-radius:var(--radius); padding:10px 14px; margin:0 0 12px; white-space:pre-wrap; overflow-wrap:anywhere; }
.message-banner { border:1px solid var(--ok); background:color-mix(in srgb, var(--ok) 8%, transparent); color:var(--fg); border-radius:var(--radius); padding:10px 14px; margin:0 0 12px; white-space:pre-wrap; overflow-wrap:anywhere; }
.convert-cols li { overflow-wrap:anywhere; }
.message-banner .btn { margin-top:8px; }
.table-wrap { overflow-x:auto; }
table.scan { border-collapse:collapse; width:100%; font-size:13px; }
table.scan th, table.scan td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
table.scan th { font-weight:600; color:var(--muted); }
table.scan .num { text-align:right; font-variant-numeric:tabular-nums; }
table.scan td:last-child { white-space:normal; }
.sub { font-weight:700; margin:16px 0 4px; }
/* 狭い画面 (スマホ・幅 400 px ほど)。fieldset は既定で min-width: min-content なので、中の広いもの (180 px のラベル列 + 欄、
   手順の行のボタン) に合わせて画面の外まで広がっていた。0 にして画面の幅に収め、ラベルと欄を縦に積む。1366 px の見た目は変えない */
fieldset, .cols > div { min-width:0; }
@media (max-width: 600px) {
  body { padding:0 10px 24px; }
  .row { grid-template-columns: minmax(0,1fr); gap:2px; }
  .row > span:empty { display:none; }
  fieldset { padding:12px 10px 14px; }
  header .muted { margin-left:0; overflow-wrap:anywhere; }
  .inline > select, .inline > input[type=text] { flex-basis:100%; }
  .inline > input.narrow { flex-basis:110px; } .inline > input.tiny { flex-basis:64px; }
}
.sketchbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 4px 0; }
.sketchbar button { padding: 3px 9px; }
.sketchbar button.active { outline: 2px solid var(--accent, #2f7ae5); }
.sketchbar .section { font-size: 12px; opacity: 0.7; margin-right: 4px; }
#sketchpad { cursor: crosshair; touch-action: none; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <h1>ADIT {{ version }}</h1>
  <a class="btn" href="/">{{ T("準備", "Prepare") }}</a>
  <a class="btn" href="/convert">{{ T("変換", "Convert") }}</a>
  <a class="btn" href="/analysis">{{ T("解析", "Analysis") }}</a>
  <a class="btn" href="/draw">Draw</a>
  <a class="btn" href="/report">{{ T("報告", "Report") }}</a>
  <form method="post" action="/language" style="margin:0"><button type="submit">English / 日本語</button></form>
  <span class="muted">{{ T("環境設定", "preferences") }}: {{ cfg_path }}</span>
</header>
{% block body %}{% endblock %}
</body>
</html>
