name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Undefined names, unused imports and syntax errors; the rule set is in pyproject.toml ([tool.ruff])
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests packaging

  unit:
    # Full test suite. Tests that need dftb+ are skipped here.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:                  # the other versions the package advertises, on one OS to bound the cost
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"          # do not use the Windows default code page
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Shared libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install --upgrade pip
      # dev alone leaves out RDKit and spglib, which skips the sketch and space-group tests.
      # Linux also installs the xrd and phonons extras so that their tests run on at least one OS.
      - if: runner.os == 'Linux'
        run: pip install ".[dev,smiles,analysis,xrd,phonons]"
      - if: runner.os != 'Linux'
        run: pip install ".[dev,smiles,analysis]"
      - run: pytest -q -rs

  dftbplus-run:
    # Install the simulation codes and run the tests that execute the generated inputs (Linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"          # do not use the Windows default code page
    steps:
      - uses: actions/checkout@v6
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qc
          create-args: python=3.12 dftbplus=*=nompi_* qe
          init-shell: bash
      # xtb lives in its own environment: xtb 6.7 and DFTB+ 25 need different versions of
      # simple-dftd3, and solving them together silently downgrades DFTB+ to 21.
      # (xtb 6.6.1 cannot be used: it aborts during geometry optimisation.)
      - name: Install xtb in a separate environment
        shell: bash -l {0}
        run: |
          micromamba create -y -n xtb -c conda-forge "xtb=6.7"
          echo "${MAMBA_ROOT_PREFIX}/envs/xtb/bin" >> "$GITHUB_PATH"
      - name: Fetch Slater-Koster set (mio-1-1, CC BY-SA 4.0) and a pseudopotential (pslibrary, GPL)
        shell: bash -l {0}
        run: |
          mkdir -p slakos && cd slakos
          curl -sL -o mio-1-1.tar.xz https://github.com/dftbparams/mio/releases/download/v1.1.0/mio-1-1.tar.xz
          tar xJf mio-1-1.tar.xz
          cd .. && mkdir -p pseudo/pslibrary && cd pseudo/pslibrary
          curl -sL -o Si.pbe-n-rrkjus_psl.1.0.0.UPF https://pseudopotentials.quantum-espresso.org/upf_files/Si.pbe-n-rrkjus_psl.1.0.0.UPF
      - shell: bash -l {0}
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - shell: bash -l {0}
        run: pip install ".[dev,smiles,analysis]"
      - name: Run the tests (OpenMPI single process; shared memory is limited in the runner)
        shell: bash -l {0}
        env:
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_plm: isolated
          OMPI_MCA_rmaps_base_oversubscribe: "yes"
          OMP_NUM_THREADS: "1"
        run: pytest -q -rs
