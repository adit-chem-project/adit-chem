# Build the Windows executable (.exe).
# Pushing a tag such as v0.1.0a1 also attaches the zip to the matching GitHub Release,
# so that users can download it without a GitHub account. See docs/INSTALL.md.
name: windows-exe

on:
  workflow_dispatch:        # manual build; the result stays an artifact
  push:
    tags: ["v*"]            # tagged build; the result is attached to a release

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,smiles,analysis]" pyinstaller
      - name: Build the executable
        run: pyinstaller packaging\adit.spec --noconfirm
      - name: Minimal smoke test (command line only; no display on the runner)
        run: |
          dist\adit\adit-cli.exe gen --list-samples
          dist\adit\adit-cli.exe gen --sample xtb_water_generated mine.json
          mkdir out
          dist\adit\adit-cli.exe gen mine.json out\run1
          dir out\run1
      - name: Zip the build
        run: Compress-Archive -Path dist\adit\* -DestinationPath ADIT-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: adit-windows
          path: ADIT-windows-x64.zip
          retention-days: 14
      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" ADIT-windows-x64.zip --generate-notes --title "${{ github.ref_name }}" || gh release upload "${{ github.ref_name }}" ADIT-windows-x64.zip --clobber
