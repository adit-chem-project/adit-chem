# Build the macOS application bundle (.app). Started by hand from the Actions page ("Run workflow").
# The bundle is neither signed nor notarised: the first launch needs right-click -> Open in Finder.
# See docs/INSTALL.md. Only Apple Silicon (arm64) is built.
name: macos-app

on:
  workflow_dispatch:        # manual build; the result stays an artifact
  push:
    tags: ["v*"]            # tagged build; the result is attached to a release

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    runs-on: macos-14         # Apple Silicon (arm64)
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,smiles,analysis]" pyinstaller
      - name: Build the application bundle
        run: pyinstaller packaging/adit.spec --noconfirm
      - name: Minimal smoke test (command line only; no display on the runner)
        run: |
          dist/adit/adit-cli gen --list-samples
          dist/adit/adit-cli gen --sample xtb_water_generated mine.json
          mkdir -p out
          dist/adit/adit-cli gen mine.json out/run1
          ls -l out/run1
          test -d dist/ADIT.app || (echo "ADIT.app was not produced" && exit 1)
      - name: Zip the bundle (keeping the permissions Finder needs)
        run: |
          cd dist && ditto -c -k --keepParent ADIT.app "ADIT-${{ env.ARCH }}.zip"
      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release create "${{ github.ref_name }}" "ADIT-${{ env.ARCH }}.zip" --generate-notes --title "${{ github.ref_name }}" \
            || gh release upload "${{ github.ref_name }}" "ADIT-${{ env.ARCH }}.zip" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: adit-macos-${{ env.ARCH }}
          path: |
            dist/ADIT-${{ env.ARCH }}.zip
            dist/adit
          retention-days: 7
